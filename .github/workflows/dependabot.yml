version: 2
updates:
  # Atualizações do Python (requirements.txt e pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/" # Raiz do projeto onde está o requirements.txt
    schedule:
      interval: "weekly" # Diariamente: "daily", Semanalmente: "weekly", Mensal: "monthly"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "security"

  # Atualizações do GitHub Actions (workflow do CI/CD)
  - package-ecosystem: "github-actions"
    directory: "/" # Repositório inteiro
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "ci"
      - "security"

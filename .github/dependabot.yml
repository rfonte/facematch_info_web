version: 2

updates:

  # Atualização automática das dependências Python do projeto (via requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"  # requirements.txt está na raiz
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Atualização automática dos GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"  # .github/workflows está na raiz
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"

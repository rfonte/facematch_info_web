<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>FaceMatch - Análise Facial</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f7f9fc;
        text-align: center;
        padding: 40px;
      }

      h1 {
        color: #333;
        margin-bottom: 20px;
      }

      input[type="file"] {
        margin: 20px auto;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #0066cc;
        color: #fff;
        border: none;
        cursor: pointer;
        border-radius: 4px;
      }

      #loading {
        margin-top: 20px;
        display: none;
      }

      #resultBox {
        margin-top: 30px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        display: inline-block;
        text-align: left;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      .result-item {
        font-size: 18px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .result-item i {
        font-size: 22px;
        color: #007bff;
      }
    </style>
  </head>
  <body>
    <h1>FaceMatch - Análise Facial</h1>

    <input type="file" id="imageInput" />
    <br />
    <button onclick="sendImage()">Enviar imagem</button>

    <div id="loading">
      <p>🔍 Processando imagem... aguarde.</p>
    </div>

    <div id="resultBox" style="display: none">
      <div class="result-item">
        <i class="fas fa-user"></i> Idade: <span id="age"></span> anos
      </div>
      <div class="result-item">
        <i class="fas fa-venus-mars"></i> Gênero: <span id="gender"></span>
      </div>
      <div class="result-item">
        <i class="fas fa-face-smile"></i> Emoção: <span id="emotion"></span>
      </div>
      <div class="result-item">
        <i class="fas fa-palette"></i> Cor da pele: <span id="race"></span>
      </div>
    </div>

    <script>
      async function sendImage() {
        const input = document.getElementById("imageInput");
        const file = input.files[0];
        if (!file) return alert("Por favor, selecione uma imagem.");

        const formData = new FormData();
        formData.append("file", file);

        // Mostrar carregando
        document.getElementById("loading").style.display = "block";
        document.getElementById("resultBox").style.display = "none";

        try {
          const response = await fetch("/analyze", {
            method: "POST",
            body: formData,
          });

          const result = await response.json();
          console.log(result);

          document.getElementById("age").textContent = result.age;
          document.getElementById("gender").textContent = traduzirGenero(
            result.dominant_gender
          );
          document.getElementById("emotion").textContent = traduzirEmocao(
            result.dominant_emotion
          );
          document.getElementById("race").textContent = traduzirRaca(
            result.dominant_race
          );

          document.getElementById("resultBox").style.display = "block";
        } catch (err) {
          alert("Erro ao processar imagem. Verifique o console.");
          console.error(err);
        } finally {
          document.getElementById("loading").style.display = "none";
        }
      }

      function traduzirGenero(genero) {
        return genero === "Man" ? "Homem" : "Mulher";
      }

      function traduzirEmocao(emocao) {
        const map = {
          angry: "Bravo",
          disgust: "Nojo",
          fear: "Medo",
          happy: "Feliz",
          sad: "Triste",
          surprise: "Surpreso",
          neutral: "Neutro",
        };
        return map[emocao] || emocao;
      }

      function traduzirRaca(raca) {
        const map = {
          asian: "Asiático",
          indian: "Indiano",
          black: "Negro",
          white: "Branco",
          "middle eastern": "Oriente Médio",
          "latino hispanic": "Latino / Hispânico",
        };
        return map[raca] || raca;
      }
    </script>
  </body>
</html>

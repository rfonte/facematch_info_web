<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Face Analyzer</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        padding: 2rem;
      }
      #preview,
      #video {
        max-width: 100%;
        max-height: 300px;
        margin-top: 1rem;
        border: 2px solid #ccc;
      }
      #loading {
        display: none;
      }
    </style>
  </head>
  <body class="container">
    <h2 class="mb-4">🔍 Face Analyzer</h2>

    <div class="mb-3">
      <label for="mode" class="form-label">Choose Mode</label>
      <select id="mode" class="form-select">
        <option value="upload" selected>Upload Image</option>
        <option value="camera">Real-time Camera</option>
      </select>
    </div>

    <div id="upload-section">
      <input
        type="file"
        id="imageInput"
        class="form-control mb-2"
        accept="image/*"
      />
      <img id="preview" />
    </div>

    <div id="camera-section" style="display: none">
      <video id="video" autoplay playsinline></video>
    </div>

    <button id="submitBtn" class="btn btn-primary mt-3">Analyze</button>
    <div id="loading" class="mt-2 text-info">⏳ Processing...</div>

    <div id="result" class="mt-4"></div>

    <script>
      const modeSelect = document.getElementById("mode");
      const uploadSection = document.getElementById("upload-section");
      const cameraSection = document.getElementById("camera-section");
      const imageInput = document.getElementById("imageInput");
      const preview = document.getElementById("preview");
      const video = document.getElementById("video");
      const submitBtn = document.getElementById("submitBtn");
      const loading = document.getElementById("loading");
      const resultDiv = document.getElementById("result");
      let currentMode = "upload";
      let videoStream = null;

      modeSelect.addEventListener("change", async () => {
        currentMode = modeSelect.value;

        if (currentMode === "camera") {
          uploadSection.style.display = "none";
          cameraSection.style.display = "block";
          submitBtn.textContent = "Capture & Analyze";

          try {
            videoStream = await navigator.mediaDevices.getUserMedia({
              video: true,
            });
            video.srcObject = videoStream;
          } catch (err) {
            alert("Unable to access camera.");
            console.error(err);
          }
        } else {
          cameraSection.style.display = "none";
          uploadSection.style.display = "block";
          submitBtn.textContent = "Analyze";
          if (videoStream) {
            videoStream.getTracks().forEach((track) => track.stop());
          }
        }
      });

      imageInput.addEventListener("change", () => {
        const file = imageInput.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            preview.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }
      });

      submitBtn.addEventListener("click", async () => {
        resultDiv.innerHTML = "";
        loading.style.display = "block";

        let blob;

        if (currentMode === "upload") {
          const file = imageInput.files[0];
          if (!file) {
            alert("Please select an image.");
            loading.style.display = "none";
            return;
          }
          blob = file;
        } else {
          const canvas = document.createElement("canvas");
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(video, 0, 0);
          blob = await new Promise((resolve) =>
            canvas.toBlob(resolve, "image/jpeg")
          );
        }

        const formData = new FormData();
        formData.append("file", blob);

        const response = await fetch("/analyze/", {
          method: "POST",
          body: formData,
        });

        const data = await response.json();
        loading.style.display = "none";

        if (data.error) {
          resultDiv.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
          return;
        }

        const { age, dominant_gender, dominant_emotion, dominant_race } = data;

        resultDiv.innerHTML = `
        <h4>🧠 Analysis Result</h4>
        <ul class="list-group">
          <li class="list-group-item">🎂 <strong>Age:</strong> ${age}</li>
          <li class="list-group-item">👤 <strong>Gender:</strong> ${dominant_gender}</li>
          <li class="list-group-item">😊 <strong>Emotion:</strong> ${dominant_emotion}</li>
          <li class="list-group-item">🎨 <strong>Skin Tone:</strong> ${dominant_race}</li>
        </ul>
      `;
      });
    </script>
  </body>
</html>
